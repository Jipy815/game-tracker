name: Backend CI (Supabase functions)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deno-checks:
    name: Deno lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: '1.x'

      - name: Cache Deno cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('supabase/functions/**') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Deno cache (populate)
        run: deno cache supabase/functions/**/*.ts

      - name: Deno lint
        run: deno lint supabase/functions

      - name: Deno type check
        run: deno check supabase/functions/**/*.ts
